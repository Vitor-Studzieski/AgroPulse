name: agropulse-api

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${API_MONGO_PORT:-27018}:27017"
    volumes:
      - api_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./infra/mongo:/scripts:ro
    environment:
      READINGS_TTL_DAYS: ${READINGS_TTL_DAYS:-180}
    entrypoint:
      - sh
      - -c
      - >
        mongosh --host mongo --quiet --file /scripts/01-replica-set.js &&
        mongosh "mongodb://mongo:27017/agropulse?replicaSet=rs0" --quiet
        --eval "var READINGS_TTL_DAYS = Number('$${READINGS_TTL_DAYS:-180}')"
        --file /scripts/02-schema.js &&
        mongosh "mongodb://mongo:27017/agropulse?replicaSet=rs0" --quiet
        --eval "var EXPECTED_READINGS_TTL_DAYS = Number('$${READINGS_TTL_DAYS:-180}')"
        --file /scripts/03-verify-schema.js
    restart: "no"

  api:
    build: ./apps/api
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DB: agropulse
      # Chave temporária apenas para desenvolvimento local. Use .env com um segredo próprio.
      JWT_SECRET: ${JWT_SECRET:-dev-only-local-secret-replace-before-deploy-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      READINGS_TTL_DAYS: ${READINGS_TTL_DAYS:-180}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    restart: unless-stopped

volumes:
  api_mongo_data:
