name: agropulse-web

services:
  mock-api:
    build: ./infra/mock-api
    ports:
      - "127.0.0.1:${MOCK_API_PORT:-8010}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${MOCK_API_PORT:-8010}}
    environment:
      API_INTERNAL_URL: http://mock-api:8080
    depends_on:
      - mock-api
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    restart: unless-stopped
