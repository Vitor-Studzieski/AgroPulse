services:
  - type: web
    name: agropulse-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: agropulse
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: READINGS_TTL_DAYS
        value: "30"
      - key: SIM_INTERVAL_SECONDS
        value: "60"
      - key: ALERT_EVAL_SECONDS
        value: "60"
      - key: ROLLUP_INITIAL_DAYS
        value: "30"
      - key: ROLLUP_OVERLAP_DAYS
        value: "8"
      - key: ROLLUP_INTERVAL_SECONDS
        value: "86400"
      - key: ALERT_WEBHOOK_URL
        value: ""
